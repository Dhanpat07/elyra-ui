<svg width="160" height="48" viewBox="0 0 160 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="elyra-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E2E8F0"/>
    </linearGradient>
  </defs>
  
  <!-- Icon -->
  <g>
    <!-- Background circle -->
    <circle cx="24" cy="24" r="22" fill="url(#elyra-grad)"/>
    
    <!-- Voice waves -->
    <rect x="14" y="16" width="3" height="16" rx="1.5" fill="white" opacity="0.9"/>
    <rect x="19" y="12" width="3" height="24" rx="1.5" fill="white"/>
    <rect x="24" y="18" width="3" height="12" rx="1.5" fill="white" opacity="0.85"/>
    <rect x="29" y="14" width="3" height="20" rx="1.5" fill="white" opacity="0.9"/>
    <rect x="34" y="20" width="3" height="8" rx="1.5" fill="white" opacity="0.7"/>
    
    <!-- AI dot -->
    <circle cx="38" cy="12" r="4" fill="url(#accent-grad)"/>
    <circle cx="38" cy="12" r="2" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Elyra Text -->
  <text x="56" y="32" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="url(#text-grad)" letter-spacing="-0.5">
    elyra
  </text>
  
  <!-- Tagline -->
  <text x="56" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#64748B" letter-spacing="1.5">
    VOICE AI PLATFORM
  </text>
</svg>
