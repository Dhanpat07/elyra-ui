<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the mark -->
    <linearGradient id="laali-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="50%" style="stop-color:#EE5A5A"/>
      <stop offset="100%" style="stop-color:#DC4444"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Mark - Abstract "L" with AI neural dots -->
  <g filter="url(#glow)">
    <!-- Main L shape with rounded corners -->
    <path d="M8 8 L8 42 Q8 48 14 48 L32 48" stroke="url(#laali-gradient)" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- AI Neural dots representing connectivity -->
    <circle cx="20" cy="20" r="3" fill="#FF6B6B"/>
    <circle cx="32" cy="28" r="2.5" fill="#FF8585"/>
    <circle cx="26" cy="36" r="2" fill="#FFAAAA"/>
    
    <!-- Connecting lines (neural network style) -->
    <line x1="20" y1="20" x2="32" y2="28" stroke="#FF6B6B" stroke-width="1" opacity="0.6"/>
    <line x1="32" y1="28" x2="26" y2="36" stroke="#FF6B6B" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="20" x2="26" y2="36" stroke="#FF6B6B" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Company Name -->
  <text x="48" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="1">
    LAALI
  </text>
  <text x="118" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="300" fill="#94A3B8" letter-spacing="1">
    AI
  </text>
  
  <!-- Tagline -->
  <text x="48" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#64748B" letter-spacing="2">
    CORPORATION
  </text>
</svg>
